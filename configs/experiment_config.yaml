# Shared experiment configuration
# Keep this as the single source of truth for parameters referenced across
# baseline / vanilla-prophet / enhanced-prophet runs, so the 9 scenarios stay comparable.

aws:
  function_name: "sandbox-lambda"   # switch to snip-infra only after the pipeline is validated here
  region: "ap-south-1"
  alias: "prod"
  pc_buffer_percent: 0    # was 10 (AWS rule of thumb); dropped because capacity.calibration_quantile
                          # already adds measured headroom, and stacking both over-provisioned ~30%

capacity:
  # Forecast -> Provisioned Concurrency conversion (src/controller/capacity_model.py),
  # fitted by src/evaluation/calibrate_capacity.py from a warm-up run's CloudWatch data.
  calibration_quantile: 0.95   # headroom = this residual quantile, so the fit covers ~95% of observed minutes
  headroom_mode: "multiplicative"  # margin proportional to the fit (scatter grows with load), or "additive";
                                   # chosen by src/evaluation/compare_capacity_models.py (Run 2026-10-29-1)

controller:
  # Live loop timing (src/controller/live_controller.py). A decision made now is
  # in charge from now + pc_ready to now + pc_ready + step, which is forecast steps
  # cloudwatch_delay + pc_ready .. + step after the newest complete data point.
  cloudwatch_delay_minutes: 3      # Lambda metrics publish late; newer minutes are incomplete
  pc_ready_minutes: 2              # measured PC scale-up lag 84 s (Run 2026-09-28-2), rounded up
  scale_up_policy: "wait_for_ready"  # raise PC only once the last allocation is READY; a put while
                                     # IN_PROGRESS restarts it (Run 2026-11-01-1, Known issue 14).
                                     # "every_minute" = old behaviour, for comparison
  max_provisioned_concurrency: 120  # cost/safety cap (~$0.23/h at 120 x 128 MB). Was 40, then 70; the
                                    # highest warm (no cold start) minute in C1 spiky reached 112
                                    # (Run 2026-11-04-1). Seasonal C2 never exceeded 27
  # Pooled EC2 calibration, runs 1 + 2, 80-400 req/s, multiplicative margin (Run 2026-10-29-1).
  # Was seasonal_c2dry_ec2_run1.json (fitted only up to 320 req/s; under-provisioned above it)
  calibration_file: "results/capacity_calibration/ec2_pooled_run1_run2.json"
  # A pattern listed here uses its own calibration instead. Spiky needs ~1.7x the environments per
  # average req/s: a 60-120 s spike fills only part of a minute, so the minute's peak concurrency sits
  # far above what its average rate suggests. Fitted on warm minutes of C1 spiky runs 2026-11-03-2
  # and 2026-11-04-1 (src/evaluation/warm_minutes.py); used by both C2 and C3
  calibration_file_by_pattern:
    spiky: "results/capacity_calibration/ec2_spiky_run1_run2.json"
  # Layer 5 (c3v2): stabilised scale-down (Analysis 2026-11-12-1). A lower goes only to the highest
  # target of the last N decisions, and is skipped if smaller than the fraction below.
  scale_down_stabilization_minutes: 5   # Kubernetes HPA's default scale-down stabilisation (300 s); longer
                                        # than the ~1 min between a trim and the spike onsets it preceded
  scale_down_min_step_fraction: 0.10    # trims in the spiky runs were median 3-5 environments at 85-100
                                        # configured (3-6%), so 10% removes them but still lets PC fall
                                        # after a spike cluster (drops of 20-80 environments)

forecasting:
  lead_time_minutes: 10         # how far ahead Prophet forecasts before a scaling action
  confidence_interval: 0.95      # Prophet's default; controls yhat_lower/yhat_upper width
  zscore_anomaly_threshold: 2.0  # layer 3: emergency override trigger
  zscore_window_minutes: 30      # layer 3: recent one-step-ahead residuals that define "normal" error;
                                 # half the training window, so it follows drift but holds ~30 points
  zscore_min_residuals: 10       # layer 3: no flag until this many residuals (a spread from 2-3 is noise)
  # Layer 1: CloudWatch signals as Prophet regressors. Prophet needs a regressor's value for every
  # minute it forecasts, and those minutes have no CloudWatch data yet, so each signal enters lagged:
  # the value for minute t is the one measured at t - regressor_lag_minutes. The lag must be at least
  # the decision's steps_ahead (9 = 1 + cloudwatch_delay 3 + pc_ready 2 + step 1 + pc_ready 2 for
  # wait_for_ready), otherwise the forecast would need data from the future; plan() checks this
  layer1_regressors: ["concurrency"]   # ConcurrentExecutions (max per minute), cloudwatch_fetch.py
  regressor_lag_minutes: 9
  # Layer 4: adaptive retraining window. Every Prophet condition already refits each minute on the
  # newest training_window_minutes (a sliding window), so Layer 4 changes the window's *length*:
  # when the forecast has been biased for most of the last drift_check_minutes, the traffic has
  # changed, and minutes from before the change mislead the fit. The window then restarts just
  # before the change (never shorter than adaptive_min_window_minutes) and grows back by one minute
  # per minute to training_window_minutes
  drift_check_minutes: 10        # median of this many newest residuals; a median ignores 1-3 spike minutes
  drift_threshold: 1.0           # drift if |median - mean| > this x std of normal residuals (Layer 3's).
                                 # Without drift the median of 10 has a std of ~0.4 std, so 1.0 is ~2.5 of
                                 # its own std: a false restart about once per 100 minutes
  adaptive_min_window_minutes: 30  # one full 30-min seasonal cycle, the least Prophet can fit it from
  layer4_variants:
    v1: {exclude_anomalies: false, direction: "both"}  # as run in 2026-11-10-2 and -3 (condition c3)
    v2: {exclude_anomalies: true, direction: "up"}     # c3v2: Layer 3's flagged minutes are bursts, not
                                                       # level shifts; an over-forecast costs money, not
                                                       # cold starts (Analysis 2026-11-12-1)
  # Rolling-origin (walk-forward) evaluation: at each origin t, train on
  # [t - training_window, t) and forecast t+1 .. t+lead_time_minutes.
  rolling:
    training_window_minutes: 60  # two full 30-min seasonal cycles
    step_minutes: 1              # re-forecast every minute (max evaluation points)
    fourier_order: 3             # terms for the custom seasonality; a sine cycle needs few
    random_seed: 42              # Prophet samples its uncertainty interval

# Realism added to every pattern by TrafficPatternShape (seeded, so identical across
# C1/C2/C3). Without it the EC2 traffic repeats almost exactly and a copy-last-cycle
# forecast beats Prophet 3x (Run 2026-10-18-2, Known issue 11).
traffic_realism:
  noise_pct: 10          # per-interval multiplicative noise, standard deviation in %
  noise_interval_s: 60   # noise changes once a minute, the forecast resolution
  drift_pct: 20          # base level rises 20% over a run, like a service gaining users

traffic_patterns:
  steady:
    base_rps: 20
    noise_pct: 5
  spiky:
    base_rps: 10
    spike_multiplier: 8
    spike_duration_minutes: 3
  seasonal:
    base_rps: 15
    daily_amplitude_pct: 60
    period_minutes: 30           # compressed "day"; matches SEASON_PERIOD_S=1800 in traffic_shapes.py

evaluation:
  felt_cold_start_ms: 1000   # a response above this is a cold start the client felt: inits take ~3 s
                             # (simulated), warm responses stay under ~500 ms even at P99.9 (Run 2026-11-04-1)

metrics:
  - p95_latency_ms
  - p99_latency_ms
  - cold_start_count
  - cost_per_request_usd
