# Shared experiment configuration
# Keep this as the single source of truth for parameters referenced across
# baseline / vanilla-prophet / enhanced-prophet runs, so the 9 scenarios stay comparable.

aws:
  function_name: "sandbox-lambda"   # switch to snip-infra only after the pipeline is validated here
  region: "ap-south-1"
  alias: "prod"
  pc_buffer_percent: 10   # AWS-recommended buffer on top of predicted peak concurrency

forecasting:
  lead_time_minutes: 10          # how far ahead Prophet forecasts before a scaling action
  retrain_window_hours: 24       # sliding window for adaptive retraining (layer 4)
  confidence_interval: 0.95      # Prophet's default; controls yhat_lower/yhat_upper width
  zscore_anomaly_threshold: 2.0  # layer 3: emergency override trigger
  # Rolling-origin (walk-forward) evaluation: at each origin t, train on
  # [t - training_window, t) and forecast t+1 .. t+lead_time_minutes.
  rolling:
    training_window_minutes: 60  # two full 30-min seasonal cycles
    step_minutes: 1              # re-forecast every minute (max evaluation points)
    fourier_order: 3             # terms for the custom seasonality; a sine cycle needs few
    random_seed: 42              # Prophet samples its uncertainty interval

traffic_patterns:
  steady:
    base_rps: 20
    noise_pct: 5
  spiky:
    base_rps: 10
    spike_multiplier: 8
    spike_duration_minutes: 3
  seasonal:
    base_rps: 15
    daily_amplitude_pct: 60
    period_minutes: 30           # compressed "day"; matches SEASON_PERIOD_S=1800 in traffic_shapes.py

metrics:
  - p95_latency_ms
  - p99_latency_ms
  - cold_start_count
  - cost_per_request_usd
