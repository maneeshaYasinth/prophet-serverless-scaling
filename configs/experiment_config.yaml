# Shared experiment configuration
# Keep this as the single source of truth for parameters referenced across
# baseline / vanilla-prophet / enhanced-prophet runs, so the 9 scenarios stay comparable.

aws:
  function_name: "sandbox-lambda"   # switch to snip-infra only after the pipeline is validated here
  region: "ap-south-1"
  alias: "prod"
  pc_buffer_percent: 0    # was 10 (AWS rule of thumb); dropped because capacity.calibration_quantile
                          # already adds measured headroom, and stacking both over-provisioned ~30%

capacity:
  # Forecast -> Provisioned Concurrency conversion (src/controller/capacity_model.py),
  # fitted by src/evaluation/calibrate_capacity.py from a warm-up run's CloudWatch data.
  calibration_quantile: 0.95   # headroom = this residual quantile, so the fit covers ~95% of observed minutes

controller:
  # Live loop timing (src/controller/live_controller.py). A decision made now is
  # in charge from now + pc_ready to now + pc_ready + step, which is forecast steps
  # cloudwatch_delay + pc_ready .. + step after the newest complete data point.
  cloudwatch_delay_minutes: 3      # Lambda metrics publish late; newer minutes are incomplete
  pc_ready_minutes: 2              # measured PC scale-up lag 84 s (Run 2026-09-28-2), rounded up
  max_provisioned_concurrency: 40  # cost/safety cap (~$0.07/h at 40 x 128 MB)
  calibration_file: "results/capacity_calibration/seasonal_train_run1.json"

forecasting:
  lead_time_minutes: 10         # how far ahead Prophet forecasts before a scaling action
  retrain_window_hours: 24       # sliding window for adaptive retraining (layer 4)
  confidence_interval: 0.95      # Prophet's default; controls yhat_lower/yhat_upper width
  zscore_anomaly_threshold: 2.0  # layer 3: emergency override trigger
  # Rolling-origin (walk-forward) evaluation: at each origin t, train on
  # [t - training_window, t) and forecast t+1 .. t+lead_time_minutes.
  rolling:
    training_window_minutes: 60  # two full 30-min seasonal cycles
    step_minutes: 1              # re-forecast every minute (max evaluation points)
    fourier_order: 3             # terms for the custom seasonality; a sine cycle needs few
    random_seed: 42              # Prophet samples its uncertainty interval

traffic_patterns:
  steady:
    base_rps: 20
    noise_pct: 5
  spiky:
    base_rps: 10
    spike_multiplier: 8
    spike_duration_minutes: 3
  seasonal:
    base_rps: 15
    daily_amplitude_pct: 60
    period_minutes: 30           # compressed "day"; matches SEASON_PERIOD_S=1800 in traffic_shapes.py

metrics:
  - p95_latency_ms
  - p99_latency_ms
  - cold_start_count
  - cost_per_request_usd
